<style>

  .three { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: var(--space-5); align-items: stretch; }
  .tools { position: fixed; right: var(--space-5); bottom: var(--space-5); z-index: 20; display: flex; gap: var(--space-2); }

  var t = React.useState(document.documentElement.getAttribute('data-theme') || initial);

  return t;
}
